  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }

    .username {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .username img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* كل مجموعة تبقى صف أفقي، والمجموعات عمودية */
    .offers-grid {
      display: flex;           /* المتاجر أفقية */
      flex-direction: row;
      gap: 16px;               /* مسافة بين المتاجر */
      margin-bottom: 40px;     /* مسافة بين المجموعات */
      overflow-x: auto;        /* تمرير أفقي عند الحاجة */
      padding-bottom: 10px;
    }

    .section-header {
      margin: 20px 0 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .offers-grid::-webkit-scrollbar {
      height: 6px;
    }

    .offers-grid::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 3px;
    }
  </style>
</head>
