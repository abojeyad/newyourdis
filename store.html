<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة يوردس</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/product-card.css">
  <link rel="stylesheet" href="css/store.css"> 
  <link rel="stylesheet" href="css/ads.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }

    .username {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .username img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* كل مجموعة تبقى صف أفقي، والمجموعات عمودية */
    .offers-grid {
      display: flex;           /* المتاجر أفقية */
      flex-direction: row;
      gap: 16px;               /* مسافة بين المتاجر */
      margin-bottom: 40px;     /* مسافة بين المجموعات */
      overflow-x: auto;        /* تمرير أفقي عند الحاجة */
      padding-bottom: 10px;
    }

    .section-header {
      margin: 20px 0 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .offers-grid::-webkit-scrollbar {
      height: 6px;
    }

    .offers-grid::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 3px;
    }
  </style>
</head>

<body>

  <div id="header-container"></div>

  <main>

  <!-- مجموعات المتاجر -->
  <div class="section-header">متاجر العطور</div>
  <div id="stores-perfume" class="offers-grid"></div>

  <div class="section-header">متاجر الملابس</div>
  <div id="stores-clothes" class="offers-grid"></div>

  <div class="section-header">متاجر الأحذية</div>
  <div id="stores-shoes" class="offers-grid"></div>
</main>


  </main>

<div id="footer-container"></div>
<script src="load-footer.js"></script>
<script src="load-header.js"></script>
<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
