<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة يوردس</title>

  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/product-card.css">
  <link rel="stylesheet" href="css/store.css"> 
  <link rel="stylesheet" href="css/ads.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }

    .username {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    .username img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* كل مجموعة تبقى صف أفقي، والمجموعات عمودية */
    .offers-grid {
      display: flex;           /* المتاجر أفقية */
      flex-direction: row;
      gap: 16px;               /* مسافة بين المتاجر */
      margin-bottom: 40px;     /* مسافة بين المجموعات */
      overflow-x: auto;        /* تمرير أفقي عند الحاجة */
      padding-bottom: 10px;
    }

    .section-header {
      margin: 20px 0 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .offers-grid::-webkit-scrollbar {
      height: 6px;
    }

    .offers-grid::-webkit-scrollbar-thumb {
      background-color: #ccc;
      border-radius: 3px;
    }
  </style>
</head>

<body>
<header>
  <div class="header-right">
    <div class="username" id="userToggle" role="button" aria-haspopup="true" aria-expanded="false">
      <img src="images/avatar.jpg" alt="صورة المستخدم">
      <span>محمد أحمد</span>
      <span class="user-arrow" aria-hidden="true"><i class="fas fa-chevron-down"></i></span>
    </div>
  </div>
  
  <div class="menu-toggle">
    <i class="fas fa-bars"></i>
  </div>

  <div class="search-box">
    <input type="text" placeholder="استكشف أفضل العروض.." />
  </div>

  <div class="header-left">
    <div class="language-selector"> 🌐 English</div>
    <div class="notifications">🔔 الإشعارات (10)</div>
    <div class="messages">✉️ الرسائل (0)</div>
    <div class="logo"><img src="logo.png" alt="شعار المنصة" /></div>
  </div>
</header>

<main class="page-layout">
  <aside class="menu-section hidden-menu" id="menu">
    <ul>
      <li class="active">
        <a href="index.html" style="text-decoration:none; color:inherit; display:flex; align-items:center;">
          <i class="fas fa-home"></i> <span>الرئيسية</span>
        </a>
      </li>
      <li><i class="fas fa-store"></i> <span>متجري</span></li>
      <li><i class="fas fa-bookmark"></i> <span>المفضلة</span></li>
      <li><i class="fas fa-chart-line"></i> <span>الإحصائيات</span></li>
      <li><i class="fas fa-cog"></i> <span>إعدادات المتجر</span></li>
      <li><i class="fas fa-sign-out-alt"></i> <span>تسجيل خروج</span></li>
    </ul>
  </aside>

  <!-- مجموعات المتاجر -->
  <div class="section-header">متاجر العطور</div>
  <div id="stores-perfume" class="offers-grid"></div>

  <div class="section-header">متاجر الملابس</div>
  <div id="stores-clothes" class="offers-grid"></div>

  <div class="section-header">متاجر الأحذية</div>
  <div id="stores-shoes" class="offers-grid"></div>
</main>

<script src="store.js"></script>
<script src="script.js"></script>
</body>
</html>
