</aside>

  <!-- ===== القسم الرئيسي ===== -->
  <section class="main-content">

    <!-- شريط الفئات الفرعية (أعلى) -->
    <div class="subcategories-bar">
      <button class="subcat active">الكل</button>
      <button class="subcat">عطور رجالية</button>
      <button class="subcat">عطور نسائية</button>
      <button class="subcat">عطور تيستر</button>
      <button class="subcat">عطور فخمة</button>
      <button class="subcat">مجموعات عطرية</button>
      <button class="subcat">عود وبخور</button>
      <button class="subcat">زيوت عطرية</button>
      <button class="subcat">ميني عطور</button>
      <button class="subcat">عروض خاصة</button>
    </div>

    <!-- ===== الأسفل: الفلاتر + المنتجات ===== -->
    <div class="content-bottom">

      <!-- لوحة الفلاتر الجانبية (يمين) -->
      <aside class="filters-panel">
        <h3>تصفية العروض</h3>

        <div class="filter-group">
          <h4>الترتيب</h4>
          <label><input type="radio" name="sort" checked> افتراضي</label>
          <label><input type="radio" name="sort"> أعلى نسبة تخفيض</label>
          <label><input type="radio" name="sort"> السعر: من الأقل إلى الأعلى</label>
          <label><input type="radio" name="sort"> السعر: من الأعلى إلى الأقل</label>
          <label><input type="radio" name="sort"> القريبة مني</label>
        </div>

        <div class="filter-group">
          <h4>الفئة</h4>
          <label><input type="radio" name="gender" checked> الكل</label>
          <label><input type="radio" name="gender"> رجال</label>
          <label><input type="radio" name="gender"> نساء</label>
          <label><input type="radio" name="gender"> أطفال</label>
        </div>

        <div class="filter-group">
          <h4>خصم %</h4>
          <label><input type="radio" name="discount" checked> الكل</label>
          <label><input type="radio" name="discount"> تخفيض 25% فأكثر</label>
          <label><input type="radio" name="discount"> تخفيض 50% فأكثر</label>
          <label><input type="radio" name="discount"> تخفيض 75% فأكثر</label>
        </div>

        <div class="filter-group">
          <h4>المدة</h4>
          <label><input type="radio" name="duration" checked> الكل</label>
          <label><input type="radio" name="duration"> تنتهي خلال 8 ساعات</label>
          <label><input type="radio" name="duration"> تنتهي خلال 24 ساعة</label>
        </div>
      </aside>

      <!-- شبكة العروض (المنتجات) -->
      <div id="offers" class="offers-grid"></div>

    </div> <!-- /.content-bottom -->

  </section>

<script src="categories.js"></script>
<script src="script.js"></script>
